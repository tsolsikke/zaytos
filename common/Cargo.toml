[package]
name = "common"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# InterruptGuard::enter が cli しなくなる（M5-d の task-preempt-in-critical から
# 有効化される）。Locked 保持中も IF=1 のままになり、timer プリエンプトが
# クリティカル区間へ食い込む経路を作れる。**bootloader は critical を一切使わ
# ないので、この feature が届いても bootloader の挙動には影響しない**（gate する
# コードが bootloader からは到達不能。kernel ビルドでのみ effective）。
preempt-in-critical-break = []
# 破壊（S12-b）: group descriptor の空きブロック数を、2 バイト先（空き inode 数の
# 欄）から読む。**外の道具（dumpe2fs）の値と食い違う。** ホストの単体テストも
# 落ちる（あちらは 3 つの欄へ別々の値を書いて offset を見ている）。
ext2-group-count-offset-break = []
# 破壊（S12-b）: 割り当てで superblock の空き数を直さない。
ext2-alloc-skip-sb-count-break = []
# 破壊（S12-b）: 割り当てで群の空き数を直さない。
ext2-alloc-skip-bg-count-break = []
# 破壊（S12-b）: ビットを見ずに、使用中のブロックでも割り当てる。
ext2-alloc-ignore-bitmap-break = []
# 破壊（S12-b）: 解放でビットを落とさず、会計だけ戻す。
ext2-free-skip-bit-break = []
