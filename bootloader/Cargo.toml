[package]
name = "bootloader"
version = "0.1.0"
edition = "2021"
publish = false

# kernel と同じ理由（独自の #[panic_handler] が std と衝突する）で、bin は
# ホストのテスト対象から外す。
[[bin]]
name = "bootloader"
test = false
bench = false

[dependencies]
common = { path = "../common" }
# M2-0c: kernel.elf を読み込むために uefi::fs::FileSystem (Vec<u8> を返す)
# を使う。これには alloc とヒープ (global_allocator) が必要。この
# ヒープは Boot Services のプールアロケータ経由であり、ExitBootServices
# より前のロード処理でのみ使う（ExitBootServices 後は使わない）。
uefi = { version = "0.39.0", features = ["alloc", "global_allocator"] }

[features]
# 起動完了直後に意図的に panic! し、パニックハンドラの動作を検証するための
# フィーチャ。`cargo xtask run --panic-test` が有効化する。通常ビルドでは
# 無効（ADR-0004 の fail-fast 挙動そのものには影響しない）。
panic-test = []
