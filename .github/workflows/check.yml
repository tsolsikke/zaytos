# 基底の検査を push のたびに走らせる（2026-09-06）。
#
# # 1 本だけ置く
#
# 段階を分けてある。まずこれだけを入れ、安定して緑になってから次を足す。
#
#   (1) push 毎        基底の `cargo xtask check`（QEMU を起こさない）  ← これ
#   (2) `--commit`     QEMU を 1 回起こす。所要を測ってから足すか決める
#   (3) `--full`       QEMU を何十回も起こす。手元で約 90 分なので、
#                      push 毎にはしない（手動起動か定期）
#
# 段階を分ける理由は、`.claude/rules` を入れたときと同じである——
# 1 本だけ置いて、実測で効くことを確かめてから残りを足す。
#
# # 前提ソフト
#
# 基底の検査が要るのは `e2fsprogs` だけである（`build.rs` が `mke2fs` で
# ext2 の像を建て、静的検査が `e2fsck` を通す）。QEMU と OVMF は (2) から要る。
# 手元の前提は README の「前提」にある。**版が違うと `mke2fs` の既定値
# （ブロックサイズ・inode サイズ）が動きうるので、実際に使った版は起動ログの
# 判定行に出る**——CI の出力と手元を突き合わせること。
#
# ツールチェインは `rust-toolchain.toml` が固定しており、`cargo` が自動で入れる。
#
# # キャッシュを置いていない
#
# 古い成果物が混ざると、検査が緑のまま意味が変わりうる。遅くて困ってから足す。
# 足すときは、キャッシュを消した回と同じ結果になることを一度確かめること。

name: check

on:
  push:
    branches: ["**"]

# 読むだけで足りる。外部サービスも呼ばない。
permissions:
  contents: read

jobs:
  base:
    name: cargo xtask check（基底）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # 履歴を全部取る。コミットメッセージの文体の検査が全履歴を見る。
        with:
          fetch-depth: 0

      - name: 前提ソフトを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: 版を出す
        run: |
          rustc --version
          cargo --version
          mke2fs -V

      - name: 基底の検査
        run: cargo xtask check
