# 検査を push のたびに走らせる（2026-09-06）。
#
# # 段階を分けてある
#
# 1 段ずつ入れ、緑になることを確かめてから次を足す。
#
#   (1) 基底 `cargo xtask check`  QEMU を起こさない                      ← 入れた
#   (2) `--commit`                QEMU を 3 回起こす（`-smp 1 / 2 / 4`）  ← 入れた
#   (3) `--full`                  QEMU を何十回も起こす。手元で約 90 分なので
#                                 push 毎にはしない（手動起動か定期）
#
# 分ける理由は、`.claude/rules` を入れたときと同じである——1 本ずつ置いて、
# 実測で効くことを確かめてから残りを足す。**実際、(2) は最初の 1 回で赤になり、
# 手元でだけ緑になる形を 1 つ見つけた**（`docs/troubleshooting.md` の 2026-09-06）。
#
# # 引き金——どちらも push のたびである（2026-09-06 に決めた）
#
# **所要を測ってから決めた**——基底が 1 分 12 秒、`--commit` が 2 分 35 秒である
# （GitHub の ubuntu-24.04。2026-09-06）。**押した後に見るには十分短い。**
#
# **`main` への push だけに絞る形は採らない**——**ブランチが `main` の 1 本しか
# 無いので、今日は同じ意味になる。** 条件を 1 つ増やすだけである。
#
# **手動起動は採らない**——**この体制には「手で回す形は回されない」前例がある**
# （`xtask` の `FLAKY_EXCLUDED` の doc。外した項目を手で回した記録は docs に無い）。
#
# **定期も採らない**——**落ちた変更を絞るのに履歴を遡ることになる。**
# **押した直後に鳴るほうが原因に近い。**
#
# # 2 つのジョブを `needs:` で繋がない
#
# **繋ぐと、基底の鈴が `--commit` の分だけ遅れて鳴る。** 並べると、基底が落ちた
# ときに `--commit` も同じ理由で落ちる（`--commit` は基底を含む）が、**二重に
# 赤くなることは受け入れる**——**速いほうの鈴を遅らせない。**
#
# # `flaky` の 4 項目はここに無い
#
# **あれは `--full` 側であり、その `--full` からも外してある**（`cargo xtask
# flaky` で手で回す）。**したがって再試行の仕組みは置かない。** **赤は読む。**
# **揺らぎで赤くなる形が出たら、そのときに `flaky` へ移すかを決める。**
#
# # 前提ソフト
#
# 基底が要るのは `e2fsprogs` だけである（`build.rs` が `mke2fs` で ext2 の像を
# 建て、静的検査が `e2fsck` を通す）。(2) は QEMU と OVMF も要る。
# 手元の前提は README の「前提」にある。**版が違うと `mke2fs` の既定値
# （ブロックサイズ・inode サイズ）が動きうるので、実際に使った版は起動ログの
# 判定行に出る**——**(2) はその行を参照と突き合わせるので、版の食い違いは
# それ自体が赤として出る。**
#
# ツールチェインは `rust-toolchain.toml` が固定しており、`cargo` が自動で入れる。
#
# # キャッシュを置いていない
#
# 古い成果物が混ざると、検査が緑のまま意味が変わりうる。遅くて困ってから足す。
# 足すときは、キャッシュを消した回と同じ結果になることを一度確かめること。

name: check

on:
  push:
    branches: ["**"]

# 読むだけで足りる。外部サービスも呼ばない。
permissions:
  contents: read

jobs:
  base:
    name: cargo xtask check（基底）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # 履歴を全部取る。コミットメッセージの文体の検査が全履歴を見る。
        with:
          fetch-depth: 0

      - name: 前提ソフトを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: 版を出す
        run: |
          rustc --version
          cargo --version
          mke2fs -V

      - name: 基底の検査
        run: cargo xtask check

  commit:
    name: cargo xtask check --commit（QEMU を 3 回）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 前提ソフトを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs qemu-system-x86 ovmf

      - name: 版を出す
        run: |
          rustc --version
          cargo --version
          mke2fs -V
          qemu-system-x86_64 --version | head -1
          dpkg-query -W -f='ovmf ${Version}\n' ovmf

      - name: コミット前の検査
        run: cargo xtask check --commit
