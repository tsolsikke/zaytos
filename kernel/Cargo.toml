[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# この bin は no_std / no_main で独自の #[panic_handler] を持つため、ホスト向けの
# テストバイナリとしてはビルドできない（std の panic_impl と衝突する）。
# 既定のままだと `cargo test` がワークスペース全体で失敗するので、bin は
# テスト対象から外す。ホストで検証するロジックは lib 側（src/lib.rs）に置く。
[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
common = { path = "../common" }

[features]
default = ["heap-poison"]
# 解放したヒープブロックを毒値(0xDE)で埋める。use-after-free を
# 「もっともらしい値が読めてしまう」形ではなく明確な異常値として
# 検出できるようにする(ADR-0012)。性能上の懸念が生じた場合はこの
# featureを外してビルドできる。
heap-poison = []
# 起動時に M3-a の描画テストパターン（RGB の四角・外周枠・はみ出し矩形）を
# 描き、コンソールを起動しない。通常起動では描かない: コンソールは変更範囲
# しか転送しないため、描いたままにするとコンソール領域の外に残骸が残り
# 続ける（ADR-0017）。`cargo xtask run --gfx-test` が有効化する。
gfx-test-pattern = []
# 起動完了後に意図的な例外を発生させ、例外ハンドラの回帰チェックを行う。
# `cargo xtask run --exception-test <kind>` が有効化する。通常ビルドには
# 含まれない。
exception-test = []
exception-test-divide-by-zero = ["exception-test"]
exception-test-invalid-opcode = ["exception-test"]
exception-test-page-fault = ["exception-test"]
# ダブルフォルトは #PF のゲートを不在にしてからページフォルトを起こして
# 誘発する。スタックを溢れさせる方法は使えない(ADR-0018)。
exception-test-double-fault = ["exception-test", "exception-test-page-fault"]
# クリティカルセクションとロックの回帰チェック。
# `cargo xtask run --critical-test <kind>` が有効化する。
critical-test = []
# 同じロックを保持したまま再取得し、二重取得検出が働くことを確認する。
critical-test-double-lock = ["critical-test"]
# 一時的に sti してから InterruptGuard に入り、IF=1 で enter した場合の
# 復元経路を確認する。PIC を全マスクした後でないと危険なため M4-c-3 で使う。
critical-test-restore-enabled = ["critical-test"]
# 割り込みを有効化する経路の回帰チェック。
# `cargo xtask run --interrupt-test <kind>` が有効化する。
interrupt-test = []
# 全 IRQ をマスクしたまま sti し、何も届かないことを確認する(M4-d-1)。
interrupt-test-enable-only = ["interrupt-test"]
# int 0x20 をソフトウェア発行し、IRQ 経路が GPR を復元することを確認する。
interrupt-test-irq-path = ["interrupt-test"]
# スタブの 16 バイト境界調整をわざと外し、境界検証が働くことを確認する。
# 検証そのものを壊すテストなので、通常ビルドには絶対に入れないこと。
misalign-test = []

# IRQ スタブ表の索引を 1 本ずらす。check_irq_stub_table の entries_ok を落とす。
idt-irq-stub-offset-test = []

# S7-c: 新しいアドレス空間へカーネルの上位を写さない。切り替えた瞬間に死ぬ。
addrspace-no-kernel-share = []
# タイマを実際に動かす(M4-d-2)。
interrupt-test-timer = ["interrupt-test"]
# EOI の発行をわざと落とし、ティックが 1 回で止まることを確認する。
# 検証が実際に機能していることを確かめるためのもの。
no-eoi-test = ["interrupt-test-timer"]
# PIC をわざと 0x30-0x3F へ再マップし、ティックがそのベクタで届くことを
# 確認する。ICW2 書き込みが実際に効いていることと、配送元が 8259A である
# ことを同時に示す。IRQ スタブ表は 0x20-0x3F を覆っており、テスト用ベクタは
# その外（0x40）にあるため、irq-path と排他にする必要は無い。
alt-offset-test = ["interrupt-test-timer"]
# リングバッファを極小にし、オーバーフロー検出が働くことを確認する。
tiny-key-buffer = []
# 生のスキャンコードをシリアルへ出す。エコーと二重になって読みにくいので
# 既定では無効。キーボード周りの切り分けが要るときだけ有効にする。
keyboard-raw-log = []
# 破壊（S12 前の手当て。zi-a で上下も同じ feature の下に入った）: 矢印を
# 未対応へ戻す。デコーダが `KeyEvent::Unsupported` を返すので前景へバイトが
# 届かず、シェルの挿入点が動かない。`--shell-test` の「左へ動かしてから
# 入れた」判定が落ちる。
keyboard-drop-arrows-test = []
# 破壊（zi-a）: Esc を未対応へ戻す。Ring 3 へ `\x1b` が届かなくなるので、
# `--shell-test` の「Esc `[` `D` の実打鍵が挿入点を動かした」判定が落ちる。
keyboard-drop-esc-test = []
# 検証（zi-b）: 起動シーケンスで ANSI の解釈を前景経路ごと実演し、判定行を
# 出す。壊す経路ではない（exception-test 等と同じ検証用フック）。
ansi-test = []
# 破壊（zi-b）: 前景経路がパーサを通さず素のまま描く。zi-b 前の接続そのもの
# ——CSI がグリフとして画面へ化けて出るので、ansi-test の判定が落ちる。
ansi-console-skip-parse-test = []
# 破壊（zi-c）: 書きで開いた fd への write が複製へ足さない。検証も戻り値も
# 正しく、書いたつもりが複製に届いていない——読み戻しの検算（58 番）が捕まえる。
write-file-skip-append-test = []
# 破壊（zi-c）: 別の inode へ足す。的のファイルが空のまま残り、読み戻しの
# 検算（58 番）が捕まえる。
write-file-wrong-inode-test = []
# 破壊（zi-c）: O_TRUNC の切り詰めを落とす。古い中身の後ろへ追記され、
# 読み戻しが「古い+新しい」の連結になる——読み戻しの検算（58 番）が捕まえる。
open-skip-truncate-test = []
# 破壊（S12 前の手当て、C）: 中断（Ctrl+C）の旗を立てない。走っている子が
# 止まらなくなる。
kill-ignore-interrupt-test = []
# 破壊（S12 前の手当て、C）: 深さ 1 でも畳む。シェル自身が Ctrl+C で死に、
# `init` が起こし直す。
kill-fold-at-depth-one-test = []
# 破壊（S12 前の手当て、C）: 子を起こす前に中断の旗を降ろさない。
# 直前の Ctrl+C が次の子へ持ち越され、起きた瞬間に止まる。
kill-keep-stale-interrupt-test = []
# 破壊（S12 前の手当て、C）: BKL を解かずに畳む。次に BKL を取る者が、
# 同じコアの再取得として捕まえる（`user-exit-keep-bkl` と同じ機序）。
kill-fold-keep-bkl-test = []
# 破壊（S12-a）: 像の複製の末尾 1 バイトを 0xFF で潰す。読み戻しが落ちる。
# 落とさなければ、取り出した像とのバイト一致がホスト側で落ちる。
# **0 で潰す形は破壊にならない**——像の末尾は既に 0 である（実測）。
fs-copy-corrupt-tail-test = []
# 破壊（S12-b）: 読む側を複製へ向けず、常に埋め込みの側を返す。
# 判定行に出る番地がカーネル像の中になり、複製の番地と食い違う。
fs-read-from-rodata-test = []
# 破壊（S12-b）: 空きブロック数の欄を 2 バイトずらして読む。common へ転送する。
ext2-group-count-offset-test = ["common/ext2-group-count-offset-break"]
# 変種（S12-b）: 割り当てたブロックを解放しない。**壊さない**——別の状態を作る
# （`paging-test` と同じ形）。割り当て中の像を取り出して e2fsck の不満を見るために要る。
fs-alloc-keep-test = []
# 変種（S12-c）: 追記した中身を戻さない。**壊さない**——書いたままの像を作る。
fs-write-keep-test = []
# 変種（S12-d）: 縮めた後に元へ戻さない。**壊さない**——0 のままの像を作る。
fs-truncate-keep-test = []
# 変種（S12-e）: 作ったファイルを消さない。**壊さない**——作ったままの像を作る。
# 1 回の起動だと最終状態が「消した後」になり、作成の誤りが削除で消える。
fs-create-keep-test = []
# 破壊（S12-e）: 作成と削除の6種。いずれも common へ転送する。
ext2-create-skip-inode-bit-test = ["common/ext2-create-skip-inode-bit"]
ext2-create-skip-links-test = ["common/ext2-create-skip-links"]
ext2-create-keep-prev-rec-len-test = ["common/ext2-create-keep-prev-rec-len"]
ext2-create-skip-inode-count-test = ["common/ext2-create-skip-inode-count"]
ext2-create-move-dirs-count-test = ["common/ext2-create-move-dirs-count"]
ext2-unlink-mark-unused-test = ["common/ext2-unlink-mark-unused"]
# 破壊（S12-f-3）: i_extra_isize を名乗らない。common へ転送する。
ext2-create-skip-extra-isize-test = ["common/ext2-create-skip-extra-isize"]
# 破壊（S12-d）: truncate の6種。いずれも common へ転送する。
ext2-truncate-off-by-one-test = ["common/ext2-truncate-off-by-one"]
ext2-truncate-always-free-test = ["common/ext2-truncate-always-free"]
ext2-truncate-keep-slot-test = ["common/ext2-truncate-keep-slot"]
ext2-truncate-skip-free-test = ["common/ext2-truncate-skip-free"]
ext2-truncate-keep-tail-test = ["common/ext2-truncate-keep-tail"]
ext2-truncate-skip-blocks-test = ["common/ext2-truncate-skip-blocks"]
# 破壊（S12-c）: 追記の6種。いずれも common へ転送する。
ext2-append-skip-size-test = ["common/ext2-append-skip-size"]
ext2-append-round-size-test = ["common/ext2-append-round-size"]
ext2-append-skip-blocks-test = ["common/ext2-append-skip-blocks"]
ext2-append-blocks-in-bytes-test = ["common/ext2-append-blocks-in-bytes"]
ext2-append-skip-link-test = ["common/ext2-append-skip-link"]
ext2-append-always-allocate-test = ["common/ext2-append-always-allocate-break"]
# 破壊（S12-b）: 割り当てと解放の4種。いずれも common へ転送する。
ext2-alloc-skip-sb-count-test = ["common/ext2-alloc-skip-sb-count-break"]
ext2-alloc-skip-bg-count-test = ["common/ext2-alloc-skip-bg-count-break"]
ext2-alloc-ignore-bitmap-test = ["common/ext2-alloc-ignore-bitmap-break"]
ext2-free-skip-bit-test = ["common/ext2-free-skip-bit-break"]
# 破壊（S12 前の手当て、C）: 止めた後に溜まっている入力を捨てない。
# 止めた打鍵そのものが残り、次のプロンプトに `^C` が余分に出る。
kill-keep-typed-input-test = []
# 破壊（S13-a）: PCI の ID の読みを 1 レジスタ（4 バイト）ずらす。
# 全装置の ID が壊れ、`info pci` との突き合わせが落ちる。
pci-config-offset-test = []
# 破壊（S13-a）: multifunction ビットを見ない。i440FX では device 1 の
# function 1（IDE）と 3（bridge）が列挙から消える。
pci-ignore-multifunction-test = []
# 破壊（S13-a）: 最初に見つけた device で列挙をやめる。集合が痩せる。
pci-stop-at-first-test = []
# 破壊（S13-b）: QueueNotify を書かない。要求は公開されたままで装置は読まず、
# ポーリングが上限に達して止まる。上限のある待機だけがこの形を観測へ変える。
virtio-skip-notify-test = []
# 破壊（S13-b）: sector 1 を要求する。像の模様は絶対オフセットから決まるので、
# ホスト側の中身の突き合わせが落ちる。
virtio-wrong-sector-test = []
# 破壊（S13-b）: データ記述子の長さを 511 にする。実測では QEMU が要求ごと
# 拒み（status=1）、status の検査が捕まえる。見込み（黙って 511 バイト書く）は
# 外れたが、捕まる。
virtio-short-desc-test = []
# 破壊（S13-c）: 像を装置から読まず、埋め込みから複製する。中身が同一なので
# バイト一致では捕まらず、ホスト側の info blockstats（読んだ量）が捕まえる。
fs-load-from-embedded-test = []
# 破壊（S13-c）: 像の先頭 4KiB を装置から読まない。superblock が 0 のままになり
# バイト一致が落ちる。末尾を欠く形は像の末尾が 0 なので破壊にならない（実測）。
virtio-load-skip-first-test = []
# 破壊（S13-e）: 最終形の像を装置へ書き戻さない。RAM の複製は正しいが
# disk0.img は古いまま——ホストの e2fsck が keep 変種で差を見る。
fs-flush-skip-test = []
# 破壊（S13-e）: 先頭の 4KiB を書き戻さない。superblock が古いまま残り、keep
# 変種で disk0.img が食い違う。末尾を欠く形は像の末尾が 0 なので罠（実測）。
virtio-flush-short-test = []
# 破壊（S13-d）: 宣言も申告も無視して、redirection entry を生のエッジ・
# ハイで書く。実測では QEMU は極性とトリガを厳密に模っておらず、届いて
# しまう——捕まえるのは読み戻し（宣言との一致の判定）である。
virtio-intx-edge-test = []
# 破壊（S13-d）: virtio の IRQ に EOI を送らない。LAPIC の ISR ビットが立った
# ままになり、2 発目が届かない——実演の 2 回目の上限つき待ちが捕まえる
# （実測。1 回の読みでは見えなかったので、実演を 2 回にした）。
virtio-skip-eoi-test = []
# 破壊（S13-d）: ハンドラが ISR を読まない。レベルの線が deassert されず
# 再送が続き、届いた数が爆発する（実測で 20000）——数の判定が捕まえる。
virtio-skip-isr-read-test = []
# 破壊（S13-d-2）: BKL を解かずに待ちへ入る。§6 違反。次に BKL を取る者が
# 同じコアの再取得として捕まえる見込み（実測で形を確かめる）。
virtio-wait-holding-bkl-test = []
# 破壊（S13-d-2）: 完了の検査の後・hlt の前で IF を開ける。lost wakeup を
# 狙う。QEMU で決定的に踏めるかは実測。
virtio-open-wakeup-window-test = []
# ページテーブルの分割・アンマップの回帰チェック（M5-a-2-2）。
# `cargo xtask run --paging-test <kind>` が有効化する。通常ビルドには
# 含まれない。いずれも「検査が実際に働くこと」を確かめるためのもので、
# 意図的に壊した状態を作る。
paging-test = []
# 分割時に PCD を落とす。読み戻し照合が不一致を検出することを確かめる。
paging-test-drop-pcd = ["paging-test"]
# PD エントリの差し替えを先に、512 エントリの書き込みを後にする。
# 中間状態を意図的に踏むため、差し替えた直後に対象領域を 1 バイト読む。
paging-test-wrong-order = ["paging-test"]
# アンマップの添字を間違える（pt_index の代わりに pd_index を使う）。
paging-test-bad-index = ["paging-test"]
# アンマップ後の invlpg を落とす。古い翻訳が TLB に残るかを見る。
paging-test-no-invlpg = ["paging-test-unmap-fault"]
# アンマップしたページを実際に読む。正しい実装では #PF になる。
# no-invlpg と対にして初めて「invlpg が効いている」と言える。
paging-test-unmap-fault = ["paging-test"]
# 稼働中のヒープが載る 2MiB ページを、使いながら分割する。
paging-test-split-heap = ["paging-test"]
# direct map の窓を高位 base ではなく低位（phys、恒等と同じ）で張る。
# 恒等が phys->phys を張っているので起動は検証手前まで正常に進むが、
# 独立 walker が DIRECT_MAP_BASE + phys を辿ると NotPresent で止まる。
# 高位窓が存在することそのものを検査していることの証明（A-1）。
paging-test-directmap-low-window = ["paging-test"]
# A-2 で登録 DirectMap へ差し替える窓の base をわざと 1 ページずらす。
# 差し替え直後の phys_to_virt 検証が期待値と食い違って停止する。登録値の
# 検証が働いていることの証明（A-1 の low-window とは層が違う）。
paging-test-directmap-wrong-base = ["paging-test"]
# カーネルスタックを意図的に溢れさせ、ガードページに触れて #PF（CR2 =
# ガードページ）が IST2 上で報告されること、#DF へ昇格しないことを確認する
# （M5-b、ADR-0019 §3.1）。`cargo xtask run --stack-test guard` が有効化する。
stack-guard-test = []
# スタックオーバーフローで #DF を本来の方法で誘発する。#PF に IST を与えず
# （下記 idt::init 参照）、溢れ → 壊れたスタック上での #PF → #DF の連鎖を出す。
# M4-b-2 の代用（#PF ゲートの Present 落とし）とは別経路。`--stack-test df`。
stack-overflow-df-test = ["stack-guard-test"]
# 協調的スイッチで、次タスクの保存コンテキストの rbx を壊す。復帰した
# タスクが GPR 照合で検出する。`cargo xtask run --task-test drop-reg`。
task-switch-drop-reg = []
# 協調的スイッチで RSP の差し替えを省く。スイッチが起きず同じタスクが回り
# 続けるのを、デモの会計・順序で検出する。`--task-test no-swap`。
task-switch-no-swap = []
# InterruptGuard を保持したまま yield を呼ぶ。on_yield のガードが critical
# nesting depth を見て fail-fast することを確認する。`--task-test in-critical`。
task-switch-yield-in-critical = []
# プリエンプティブスイッチで RSP0 の更新を落とす。M5-c で入れた RSP0 読み戻し
# 検査が発火して halt することを確認する。`--task-test drop-rsp0`。
task-switch-drop-rsp0 = []
# プリエンプトが set/store の窓に落ちる確率を上げるため NOP そりを長くする。
# 窓カウントが増えることで、統計的レジスタ検証の判定が働くことを確かめる
# （条件1）。`--task-test widen-window`。
task-widen-preempt-window = []
# InterruptGuard の cli を落とす（common へ渡す。下記）。Locked 保持中も IF=1 の
# ままになり、timer が割り込んで別タスクが同じ Locked を取り二重取得検出が
# 発火する。`depth>0 ⟹ IF=0` の構造的保証が崩れたときプリエンプトがクリティカル
# 区間へ食い込むことの実証。`--task-test preempt-in-critical`。
task-preempt-in-critical = ["common/preempt-in-critical-break"]
# M5-e-4: Ring 3 遷移の破壊確認（集約）。いずれも既定ビルドには入らない。
# ucode64 の DPL を 0 にする。M5-e-1 の DPL 読み戻しアサートをこのときだけ外し、
# runtime で iretq 自身が #GP になる（Ring 3 に落ちない）ことを確認する。
# `--ring3-test user-desc-dpl0`。
ring3-test-user-desc-dpl0 = []
# ユーザーページの USER を落とす（U=0）。M5-e-2 の両側監査が遠征前に user
# violation として捕まえる。`--ring3-test user-page-supervisor`。
ring3-test-user-page-supervisor = []
# 遠征の RSP0 据え付け（ring3::enter の set_rsp0）を落とす。#GP がメインの
# スタックへ切り替わり、handler_in_excursion が false になって捕まる。M5-d の
