ioapic-keyboard-broadcast-test = []

# --- S4-b-2: BKL の破壊 ---
# BKL を保持したまま IF=1 にする。**不変条件「保持区間 = IF=0」そのものの破壊で
# ある。** タイマが入り、同じコアが irq_entry から取ろうとして再帰検出が発火する。
bkl-hold-with-if-set-test = []
# 定常ループが hlt の前に BKL を離さない。**もう一方のコアが IF=0 で待ち続け、
# タイムアウトして原因を出す。**「静かに止まる」を「うるさく止まる」へ変えた形の実証。
bkl-hold-across-hlt-test = []
# BKL を取ったまま二度と離さない。**タイムアウトの経路を通す唯一の形である**
# （既存の 2 破壊はどちらも再帰検出が先に鳴る）。同時実行を要さない。
bkl-hold-forever-test = []
# タイマ入口で BKL を取らない。**ロックだけを飛ばして計数は残す**ので、
# 破壊ビルドのカウンタは「守られるはずだった区間」を数えている（本番の定義と別物）。
bkl-skip-timer-entry-test = []
# 入口の保持区間を広げて重なりを増幅する。**広げた窓の重なりであって、素の重なりの
# 頻度は別である。** 「BKL が無ければ常に 2 になる」を意味しない。
bkl-widen-entry-window-test = []
# B-2a-5: higher-half の破壊確認。いずれも既定ビルドには入らない。`--highhalf-test <kind>`。
# (a) 静的 PML4[0] の存在ビットを落とす。恒等が not-present になり、mov cr3 直後の低位命令
# フェッチが解決できずトリプルフォルトする。`--highhalf-test no-identity-in-boot-pt`。
highhalf-no-identity-in-boot-pt = []
# (b) PDPT_high のエントリを 510→509 へずらす。高位 _start への jmp 先が未マップで
# トリプルフォルトする。`--highhalf-test bad-high-slot`。
highhalf-bad-high-slot = []
# (c) M2-d/A-1 の本流テーブルからカーネル高位マッピングを外す。そのテーブルへの CR3 切り替えで
# 高位コードが見えなくなる。期待署名は実測で確定（切替前検証が捕まえる可能性がある）。
# `--highhalf-test no-kernel-high-in-live-table`。
highhalf-no-kernel-high-in-live-table = []
# (d) トランポリンに絶対メモリ参照命令を 1 行挿入する。**実行時ではなく静的なバイト単位一致
# 検査で捕まえる。** `--highhalf-test trampoline-absolute-ref`。
highhalf-trampoline-absolute-ref = []
# B-2b-4: 恒等除去の 5a 復帰の検証。恒等除去点で remove_identity を呼び、必須領域のヒープ高位 VA
# を解決不能な高位 VA（空の PML4[257]）へ差し替えて step4 を失敗させる。5a が PML4[0] を書き戻して
# 原因を報告し halt すること、書き戻しで恒等が実際に復活すること（低位 VA が walk で present に戻る）
# を実証する。`--highhalf-test remove-verify-fail`。
highhalf-remove-verify-fail = []
# B-2b-4(e): ヒープ初期化を低位（heap_start=物理）へ戻す。恒等除去は既定位置のまま走り、除去後に
# 低位ヒープを触るスモークテストがデレフして死ぬ。除去より前にヒープを高位化する順序の必要性を実証する。
# 期待署名は #PF（vector 14、CR2=低位ヒープ）。`--highhalf-test remove-before-highify`。
highhalf-remove-before-highify = []
# B-2b-4(e): 恒等除去の直後に意図的 panic する。パニック経路（シリアル I/O・レジスタ値のみ・walk なし）が
# 恒等非依存であることを、除去後の実状態で確認する。期待署名はパニックダンプ。`--highhalf-test panic-after-remove`。
highhalf-panic-after-remove = []
