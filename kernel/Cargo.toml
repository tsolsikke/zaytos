[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# この bin は no_std / no_main で独自の #[panic_handler] を持つため、ホスト向けの
# テストバイナリとしてはビルドできない（std の panic_impl と衝突する）。
# 既定のままだと `cargo test` がワークスペース全体で失敗するので、bin は
# テスト対象から外す。ホストで検証するロジックは lib 側（src/lib.rs）に置く。
[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
common = { path = "../common" }

[features]
default = ["heap-poison"]
# 解放したヒープブロックを毒値(0xDE)で埋める。use-after-free を
# 「もっともらしい値が読めてしまう」形ではなく明確な異常値として
# 検出できるようにする(ADR-0012)。性能上の懸念が生じた場合はこの
# featureを外してビルドできる。
heap-poison = []
# 起動時に M3-a の描画テストパターン（RGB の四角・外周枠・はみ出し矩形）を
# 描き、コンソールを起動しない。通常起動では描かない: コンソールは変更範囲
# しか転送しないため、描いたままにするとコンソール領域の外に残骸が残り
# 続ける（ADR-0017）。`cargo xtask run --gfx-test` が有効化する。
gfx-test-pattern = []
# 起動完了後に意図的な例外を発生させ、例外ハンドラの回帰チェックを行う。
# `cargo xtask run --exception-test <kind>` が有効化する。通常ビルドには
# 含まれない。
exception-test = []
exception-test-divide-by-zero = ["exception-test"]
exception-test-invalid-opcode = ["exception-test"]
exception-test-page-fault = ["exception-test"]
# ダブルフォルトは #PF のゲートを不在にしてからページフォルトを起こして
# 誘発する。スタックを溢れさせる方法は使えない(ADR-0018)。
exception-test-double-fault = ["exception-test", "exception-test-page-fault"]
# クリティカルセクションとロックの回帰チェック。
# `cargo xtask run --critical-test <kind>` が有効化する。
critical-test = []
# 同じロックを保持したまま再取得し、二重取得検出が働くことを確認する。
critical-test-double-lock = ["critical-test"]
# 一時的に sti してから InterruptGuard に入り、IF=1 で enter した場合の
# 復元経路を確認する。PIC を全マスクした後でないと危険なため M4-c-3 で使う。
critical-test-restore-enabled = ["critical-test"]
# 割り込みを有効化する経路の回帰チェック。
# `cargo xtask run --interrupt-test <kind>` が有効化する。
interrupt-test = []
# 全 IRQ をマスクしたまま sti し、何も届かないことを確認する(M4-d-1)。
interrupt-test-enable-only = ["interrupt-test"]
# int 0x20 をソフトウェア発行し、IRQ 経路が GPR を復元することを確認する。
interrupt-test-irq-path = ["interrupt-test"]
# スタブの 16 バイト境界調整をわざと外し、境界検証が働くことを確認する。
# 検証そのものを壊すテストなので、通常ビルドには絶対に入れないこと。
misalign-test = []

# IRQ スタブ表の索引を 1 本ずらす。check_irq_stub_table の entries_ok を落とす。
idt-irq-stub-offset-test = []

# S7-c: 新しいアドレス空間へカーネルの上位を写さない。切り替えた瞬間に死ぬ。
addrspace-no-kernel-share = []
# タイマを実際に動かす(M4-d-2)。
interrupt-test-timer = ["interrupt-test"]
# EOI の発行をわざと落とし、ティックが 1 回で止まることを確認する。
# 検証が実際に機能していることを確かめるためのもの。
no-eoi-test = ["interrupt-test-timer"]
# PIC をわざと 0x30-0x3F へ再マップし、ティックがそのベクタで届くことを
# 確認する。ICW2 書き込みが実際に効いていることと、配送元が 8259A である
# ことを同時に示す。IRQ スタブ表は 0x20-0x3F を覆っており、テスト用ベクタは
# その外（0x40）にあるため、irq-path と排他にする必要は無い。
alt-offset-test = ["interrupt-test-timer"]
# リングバッファを極小にし、オーバーフロー検出が働くことを確認する。
tiny-key-buffer = []
# 生のスキャンコードをシリアルへ出す。エコーと二重になって読みにくいので
# 既定では無効。キーボード周りの切り分けが要るときだけ有効にする。
keyboard-raw-log = []
# ページテーブルの分割・アンマップの回帰チェック（M5-a-2-2）。
# `cargo xtask run --paging-test <kind>` が有効化する。通常ビルドには
# 含まれない。いずれも「検査が実際に働くこと」を確かめるためのもので、
# 意図的に壊した状態を作る。
paging-test = []
# 分割時に PCD を落とす。読み戻し照合が不一致を検出することを確かめる。
paging-test-drop-pcd = ["paging-test"]
# PD エントリの差し替えを先に、512 エントリの書き込みを後にする。
# 中間状態を意図的に踏むため、差し替えた直後に対象領域を 1 バイト読む。
paging-test-wrong-order = ["paging-test"]
# アンマップの添字を間違える（pt_index の代わりに pd_index を使う）。
paging-test-bad-index = ["paging-test"]
# アンマップ後の invlpg を落とす。古い翻訳が TLB に残るかを見る。
paging-test-no-invlpg = ["paging-test-unmap-fault"]
# アンマップしたページを実際に読む。正しい実装では #PF になる。
# no-invlpg と対にして初めて「invlpg が効いている」と言える。
paging-test-unmap-fault = ["paging-test"]
# 稼働中のヒープが載る 2MiB ページを、使いながら分割する。
paging-test-split-heap = ["paging-test"]
# direct map の窓を高位 base ではなく低位（phys、恒等と同じ）で張る。
# 恒等が phys->phys を張っているので起動は検証手前まで正常に進むが、
# 独立 walker が DIRECT_MAP_BASE + phys を辿ると NotPresent で止まる。
# 高位窓が存在することそのものを検査していることの証明（A-1）。
paging-test-directmap-low-window = ["paging-test"]
# A-2 で登録 DirectMap へ差し替える窓の base をわざと 1 ページずらす。
# 差し替え直後の phys_to_virt 検証が期待値と食い違って停止する。登録値の
# 検証が働いていることの証明（A-1 の low-window とは層が違う）。
paging-test-directmap-wrong-base = ["paging-test"]
# カーネルスタックを意図的に溢れさせ、ガードページに触れて #PF（CR2 =
# ガードページ）が IST2 上で報告されること、#DF へ昇格しないことを確認する
# （M5-b、ADR-0019 §3.1）。`cargo xtask run --stack-test guard` が有効化する。
stack-guard-test = []
# スタックオーバーフローで #DF を本来の方法で誘発する。#PF に IST を与えず
# （下記 idt::init 参照）、溢れ → 壊れたスタック上での #PF → #DF の連鎖を出す。
# M4-b-2 の代用（#PF ゲートの Present 落とし）とは別経路。`--stack-test df`。
stack-overflow-df-test = ["stack-guard-test"]
# 協調的スイッチで、次タスクの保存コンテキストの rbx を壊す。復帰した
# タスクが GPR 照合で検出する。`cargo xtask run --task-test drop-reg`。
task-switch-drop-reg = []
# 協調的スイッチで RSP の差し替えを省く。スイッチが起きず同じタスクが回り
# 続けるのを、デモの会計・順序で検出する。`--task-test no-swap`。
task-switch-no-swap = []
# InterruptGuard を保持したまま yield を呼ぶ。on_yield のガードが critical
# nesting depth を見て fail-fast することを確認する。`--task-test in-critical`。
task-switch-yield-in-critical = []
# プリエンプティブスイッチで RSP0 の更新を落とす。M5-c で入れた RSP0 読み戻し
# 検査が発火して halt することを確認する。`--task-test drop-rsp0`。
task-switch-drop-rsp0 = []
# プリエンプトが set/store の窓に落ちる確率を上げるため NOP そりを長くする。
# 窓カウントが増えることで、統計的レジスタ検証の判定が働くことを確かめる
# （条件1）。`--task-test widen-window`。
task-widen-preempt-window = []
# InterruptGuard の cli を落とす（common へ渡す。下記）。Locked 保持中も IF=1 の
# ままになり、timer が割り込んで別タスクが同じ Locked を取り二重取得検出が
# 発火する。`depth>0 ⟹ IF=0` の構造的保証が崩れたときプリエンプトがクリティカル
# 区間へ食い込むことの実証。`--task-test preempt-in-critical`。
task-preempt-in-critical = ["common/preempt-in-critical-break"]
# M5-e-4: Ring 3 遷移の破壊確認（集約）。いずれも既定ビルドには入らない。
# ucode64 の DPL を 0 にする。M5-e-1 の DPL 読み戻しアサートをこのときだけ外し、
# runtime で iretq 自身が #GP になる（Ring 3 に落ちない）ことを確認する。
# `--ring3-test user-desc-dpl0`。
ring3-test-user-desc-dpl0 = []
# ユーザーページの USER を落とす（U=0）。M5-e-2 の両側監査が遠征前に user
# violation として捕まえる。`--ring3-test user-page-supervisor`。
ring3-test-user-page-supervisor = []
# 遠征の RSP0 据え付け（ring3::enter の set_rsp0）を落とす。#GP がメインの
# スタックへ切り替わり、handler_in_excursion が false になって捕まる。M5-d の
# task-switch-drop-rsp0（schedule_switch 側）とは別物。`--ring3-test drop-rsp0`。
ring3-test-drop-rsp0 = []
# 遠征フラグ（IN_RING3）を立てない。畳み条件3が欠け、cli の #GP が
# 畳まれず dump+halt する（畳みが「立っていないのに畳む」ことがない実証）。
# `--ring3-test no-fold-flag`。
ring3-test-no-fold-flag = []
# S8-c: 例外フレームの CS を既知でない値（0x33）へ差し替える。RPL=3 は保つので
# 畳みの 3 条件は通り、健全性判定だけが落ちて dump+halt する。
# `--ring3-test corrupt-frame-cs`。
ring3-test-corrupt-frame-cs = []
# S9-a: map_4kib の書き込み可否の引数を無視し、葉を常に W=1 で作る。読み取り
# 専用で張ったユーザーページへ Ring 3 が書けてしまい、ring3-vectors の
# #PF-write-ro が #PF ではなく後続の ud2（ベクタ 6）で畳まれる。
# paging-test の傘には入れない。傘に入れると Ring 3 の検証自体が載らなくなり、
# 破壊を観測する側が消える。`--paging-test map-force-writable`。
map-force-writable = []
# M5-f-1-2: int 0x80 システムコールの破壊確認。いずれも既定ビルドには入らない。
# 第 4 引数を context.r10 でなく context.rcx から読む。probe が記録した第 4 引数が
# 期待値と食い違い、R10 規約であることが実証される。`--syscall-test arg4-rcx`。
syscall-test-arg4-rcx = []
# syscall ゲート（0x80）の DPL を 0 にする。Ring 3 からの int 0x80 がゲート DPL<CPL で
# #GP になり、syscall_entry に到達しない。起動時 DPL 検査は期待値も 0 になるので通り、
# 異常は runtime の #GP として現れる。`--syscall-test gate-dpl0`。
syscall-test-gate-dpl0 = []
# 戻り値の context.rax 書き戻しを落とす。ユーザーが期待した戻り値を受け取れず、
# ユーザースタックへ store した値が食い違う。`--syscall-test drop-retval`。
syscall-test-drop-retval = []
# M5-f-2-1: ユーザーポインタ検証の破壊確認。隔離して検出できる 3 種のみ（範囲/present/
# overflow は多層防御に隠れて単独では検出できない。verification-coverage 参照）。
# 葉/中間の U=1 判定を外す。ユーザー範囲内の U=0 ページ（無効3）が受理され battery が
# 検出して halt する。`--syscall-test validate-skip-us`。
syscall-test-validate-skip-us = []
# ページ走査を先頭ページだけで打ち切る。末尾ページの無効（無効4の跨ぎ）を取り逃して
# 受理され battery が検出して halt する。`--syscall-test validate-skip-laststep`。
syscall-test-validate-skip-laststep = []
# 検証器を常に受理にする。検証器の全体機能停止を battery が検出して halt する
# （多層防御の最後の砦の確認）。`--syscall-test validate-skip-all`。
syscall-test-validate-skip-all = []
# M5-f-2-2: copy_from_user の破壊確認。既定ビルドには入らない。
# SYS_CHECKSUM が validate を経ずに UserSlice をモジュール内で直接構築して読む（型保証の
# 境界を突く）。カーネルポインタで -EFAULT のはずが総和が返り、verify が検出して halt する。
# `--syscall-test copy-skip-validate`。
syscall-test-copy-skip-validate = []
# copy_from_user が len を 1 バイト超えて読む。末尾の有効ページ内に置いた余分な既知バイトが
# 総和へ混ざり、内容往復のチェックサムが決定的に食い違う。`--syscall-test copy-overrun`。
syscall-test-copy-overrun = []
# S1-b-2: ACPI の検証経路の破壊確認。いずれも既定ビルドには入らない。
# `cargo xtask run --acpi-test <kind>` が有効化する。観測は panic ではなく、
# 「検出のログが出て、MADT の列挙が完了しないこと」である。
acpi-test = []
# MADT の署名を壊す。署名の照合が長さやチェックサムより先に弾く。
acpi-test-bad-signature = ["acpi-test"]
# MADT のチェックサムを壊す（署名と長さは無傷）。
acpi-test-bad-checksum = ["acpi-test"]
# MADT の length を仕様の最小長（44）未満にする。
acpi-test-bad-length = ["acpi-test"]
# MADT の最初のエントリの length を 0 にする。守っていなければ無限ループになる。
# チェックサムは合わせ直すので、検出されるのはエントリ長 0 の経路である。
acpi-test-zero-entry-length = ["acpi-test"]
# RSDP の物理アドレスを、classify() が Unmapped にする最大の記述子の中点へ
# 差し替える。#PF にならず検出されることの実証。アドレスは実行時に導く。
acpi-test-unmapped-rsdp = ["acpi-test"]
# RSDP の物理アドレスを direct map 窓の外（窓長そのもの）へ差し替える。
acpi-test-rsdp-outside-window = ["acpi-test"]
# S1-c: APIC MMIO の写像の破壊確認。いずれも既定ビルドには入らない。
# `cargo xtask run --apic-test <kind>` が有効化する。観測は panic ではなく、
# 「検出のログが出て、LAPIC の読みが行われないこと」である。
# 検出経路ごとに分けてある（写像の有無 / 写像先の正しさ / MSR との突き合わせ）。
apic-test = []
# 写像そのものを省く。「張った後」の translate が捕まえる。読みが写像に
# 依存していることの実証。
apic-test-skip-map = ["apic-test"]
# 写像先の物理だけを稼働中の PML4 へ差し替える。翻訳は張られるので、
# 「翻訳がある」だけを見る検査では通ってしまう形である。
apic-test-wrong-target = ["apic-test"]
# MADT が名乗る Local APIC のアドレスを 1 ページずらし、IA32_APIC_BASE と
# 食い違わせる。突き合わせが働き、写像も読みも行われないことを見る。
apic-test-base-mismatch = ["apic-test"]

# --- S2-d-1c: キーボードの配送を I/O APIC 経由へ切り替える段の破壊 ---
# redirection entry へ、ゲートの無い別のベクタを書く。読み戻しの主張と到達の
# 主張が**両方**落ちる。2 つの検出経路がどちらも生きていることを見る。
ioapic-wrong-vector-test = []
# I/O APIC 側のマスクを外さない。設定は正しいので読み戻しは通り、**到達だけが
# 落ちる。** 2 つの主張が独立していることの証拠になる。
ioapic-skip-unmask-test = []
# ioapic-legacy-spurious-test は作ったが**撤回した。** 「移行済みの IRQ でも
# 8259 の ISR を読むと誤判定する」という予測が、実測で外れたためである。
# pic::is_spurious は IRQ7 / IRQ15 以外では ISR を見ずに false を返すので、
# IRQ1 では読んでも判定が変わらない。**何も壊さず緑になる破壊は置かない。**
# PIC 側の IRQ1 をマスクしない。二重配送になる。移行後は経路ごとにベクタが
# 違う（8259 は 0x21、I/O APIC は 0x42）ので、**0x21 で届いたキーがあること**
# として観測できるはずである。
ioapic-keep-pic-irq1-test = []

# --- S2-d-2: タイマを Local APIC タイマへ移す段の破壊 ---
# 較正の戻り値を 2 倍にする。初期カウントは較正値を要求周波数で割って出すので
# 2 倍になり、**タイマは半分の速さで走る**。**較正値が初期カウントへ実際に
# 流れていることの証明**である。
#
# **カーネル側の許容幅では捕まらない。** 実効周波数も較正値から導くので、
# 両辺が同じ倍率で動いて比は 100Hz のまま一致する（自己無矛盾）。
# 捕まえるのはホストの実時間を基準にする `lapic-timer-test` である。
#
# 較正が呼ばれない構成では空振りするので、適用したことをログへ出し、
# 出ていなければ xtask 側で落とす。
lapic-timer-scale-calibration-test = []
# 較正で書く分周と、戻り値に載せる分周を食い違わせる。分周を戻り値に含める形が
# 塞いでいる罠を、構造ごと壊して確かめる。
lapic-timer-wrong-divide-test = []
# PIC を全マスクせずに LVT を開ける。PIT と Local APIC タイマの両方が届く。
lapic-timer-no-mask-all-test = []

# --- S3-b-2a: cpu_id() の tripwire の破壊 ---
# cpu_id() に非 0 を返させ、GPR 照合デモが bootstrap processor 以外で走ることを
# 拒む tripwire（`task::require_bootstrap_processor`）が停止することを確かめる。
#
# **MAX_CPUS > 1 でなければこの破壊は作れない。** MAX_CPUS = 1 のまま非 0 を
# 返すと this_cpu_ptr が配列外を指し、破壊が別の未定義動作を作ってしまう。
#
# **示すのは「分岐が働くこと」だけである。** 実際の並行アクセスは示さない。
percpu-fake-nonzero-cpu-id = []

# --- S3-b-2b-1: 設置したトランポリンの雛形一致検査の破壊 ---
# 設置済みのコピーを 1 バイト壊す。パッチされる 3 領域の外を狙うので、雛形との
# バイト比較が捕まえる。**雛形を壊しても意味が無い**（コピー元なので両方が動く）。
smp-tramp-corrupt-copy-test = []

# --- S3-b-2b-2: CURRENT の sentinel の破壊 ---
# AP からスケジューラの現在タスクを読む。この段は AP でタスクを実行しないので、
# sentinel を読んで停止するのが正しい。丸めていたら「タスク 0 が走っている」と
# 静かに答えていた。
smp-ap-touch-scheduler-test = []

# --- S4-a: AP の LAPIC タイマと per-CPU ティックの破壊 ---
# AP が自分の SVR を書かない。BSP の set_spurious_vector は BSP の Local APIC に
# しか効いていないので、**AP にティックが 1 本も来ない。**
