[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# この bin は no_std / no_main で独自の #[panic_handler] を持つため、ホスト向けの
# テストバイナリとしてはビルドできない（std の panic_impl と衝突する）。
# 既定のままだと `cargo test` がワークスペース全体で失敗するので、bin は
# テスト対象から外す。ホストで検証するロジックは lib 側（src/lib.rs）に置く。
[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
common = { path = "../common" }

[features]
default = ["heap-poison"]
# 解放したヒープブロックを毒値(0xDE)で埋める。use-after-free を
# 「もっともらしい値が読めてしまう」形ではなく明確な異常値として
# 検出できるようにする(ADR-0012)。性能上の懸念が生じた場合はこの
# featureを外してビルドできる。
heap-poison = []
# 起動時に M3-a の描画テストパターン（RGB の四角・外周枠・はみ出し矩形）を
# 描き、コンソールを起動しない。通常起動では描かない: コンソールは変更範囲
# しか転送しないため、描いたままにするとコンソール領域の外に残骸が残り
# 続ける（ADR-0017）。`cargo xtask run --gfx-test` が有効化する。
gfx-test-pattern = []
# 起動完了後に意図的な例外を発生させ、例外ハンドラの回帰チェックを行う。
# `cargo xtask run --exception-test <kind>` が有効化する。通常ビルドには
# 含まれない。
exception-test = []
exception-test-divide-by-zero = ["exception-test"]
exception-test-invalid-opcode = ["exception-test"]
exception-test-page-fault = ["exception-test"]
# ダブルフォルトは #PF のゲートを不在にしてからページフォルトを起こして
# 誘発する。スタックを溢れさせる方法は使えない(ADR-0018)。
exception-test-double-fault = ["exception-test", "exception-test-page-fault"]
# クリティカルセクションとロックの回帰チェック。
# `cargo xtask run --critical-test <kind>` が有効化する。
critical-test = []
# 同じロックを保持したまま再取得し、二重取得検出が働くことを確認する。
critical-test-double-lock = ["critical-test"]
# 一時的に sti してから InterruptGuard に入り、IF=1 で enter した場合の
# 復元経路を確認する。PIC を全マスクした後でないと危険なため M4-c-3 で使う。
critical-test-restore-enabled = ["critical-test"]
# 割り込みを有効化する経路の回帰チェック。
# `cargo xtask run --interrupt-test <kind>` が有効化する。
interrupt-test = []
# 全 IRQ をマスクしたまま sti し、何も届かないことを確認する(M4-d-1)。
interrupt-test-enable-only = ["interrupt-test"]
# int 0x20 をソフトウェア発行し、IRQ 経路が GPR を復元することを確認する。
interrupt-test-irq-path = ["interrupt-test"]
# スタブの 16 バイト境界調整をわざと外し、境界検証が働くことを確認する。
# 検証そのものを壊すテストなので、通常ビルドには絶対に入れないこと。
misalign-test = []
